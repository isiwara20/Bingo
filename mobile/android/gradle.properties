# Project-wide Gradle settings.

# JVM memory settings
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# React Native architectures (armeabi-v7a for older devices, arm64-v8a for modern)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (keep false for stability with current dependencies)
newArchEnabled=false

# Hermes JS engine (recommended – smaller bundle, faster startup)
hermesEnabled=true
