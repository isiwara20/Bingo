# Project-wide Gradle settings.

# JVM memory settings
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
org.gradle.parallel=false
org.gradle.workers.max=1

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# React Native architectures (armeabi-v7a for older devices, arm64-v8a for modern)
# For emulator (x86_64). For physical device use: arm64-v8a
reactNativeArchitectures=x86_64

# New Architecture (keep false for stability with current dependencies)
newArchEnabled=false

# Hermes JS engine (recommended – smaller bundle, faster startup)
hermesEnabled=true
